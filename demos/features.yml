# Mapa de funcionalidades de ReinventAR, sacado del código (no de suposiciones).
#
# Stack: backend FastAPI (app/*.py; los routers son app/*_api.py y app/main.py) y una SPA vanilla
# (web/index.html + web/js/*.js) con router por hash en web/js/app.js. Las "rutas" son hashes (#/…).
# Navegación principal (web/index.html, .navbar): Inicio #/, Buscar #/buscar, Itinerario #/itinerario,
# Eventos #/eventos, Viaje #/viaje. Arriba a la derecha: tema (#themeBtn) y Ajustes (#/ajustes).
# En el celular la .navbar pasa a ser la barra inferior.
#
# Referencia para grabar: staging (https://staging.reinventar.app) con el usuario de prueba «tester».
# Nunca van contraseñas ni datos personales acá: el repo es público.
#
# Selectores: en el front no hay ningún data-testid (0 coincidencias en web/). Se anota el mejor
# selector estable que existe (id > aria-label > rol+texto) con esta notación:
#   - CSS normal:                       "#username", "[aria-label='Ajustes']"
#   - rol + nombre accesible:           "role=button[name='Entrar']"
#   - texto visible (último recurso):   "text=Tus grabaciones"
# Donde haría falta un data-testid, va en faltan_testids con el nombre sugerido.
#
# Campos extra: audiencia (usuario|admin), complejidad (baja|media|alta) y requiere (dependencias
# externas que afectan si se puede grabar en video: microfono, geolocalizacion, push, llm, stt,
# red, google_maps, camara, biometria, catalogo, datos_previos, reloj_simulado).

features:

  # --- Cuenta y acceso ---------------------------------------------------------------------------

  - id: login-con-contrasena
    nombre: "Ingreso con usuario y contraseña"
    audiencia: usuario
    ruta: "#/login"
    precondiciones: ["sin sesión (el router manda a #/login si no hay token)"]
    pasos:
      - "abrir la app sin sesión: redirige a #/login"
      - "completar Usuario"
      - "completar Contraseña (se puede mostrar con el ojo)"
      - "tocar Entrar"
      - "si la contraseña es temporal, va a #/password; si no, a Inicio"
    selectores:
      usuario: "#username"
      contrasena: "#password"
      mostrar_contrasena: ".ra-pass-eye"
      entrar: "role=button[name='Entrar']"
      error: ".notice.err"
    faltan_testids: ["login-entrar", "login-error"]
    datos_prueba: {usuario: "tester", contrasena: "<desde secreto local, nunca en el repo>"}
    complejidad: baja
    requiere: [red]
    fuentes: ["web/js/app.js (viewLogin, finishLogin)", "web/js/ui.js (PasswordField)", "web/js/api.js (Auth.login)", "app/auth_api.py (/api/login)"]

  - id: login-con-passkey
    nombre: "Ingreso con Face ID / huella (passkey)"
    audiencia: usuario
    ruta: "#/login"
    precondiciones: ["passkey ya registrada en este dispositivo (ver passkey-ajustes)", "dispositivo con WebAuthn"]
    pasos: ["abrir #/login", "tocar «Entrar con Face ID» (o huella)", "confirmar con biometría del sistema"]
    selectores:
      entrar_passkey: "role=button[name^='Entrar con']"
    faltan_testids: ["login-passkey"]
    datos_prueba: {}
    complejidad: media
    requiere: [biometria, red]
    fuentes: ["web/js/passkey.js (PasskeyLoginButton)", "app/passkey_api.py (/api/passkey/login/*)"]

  - id: cambio-de-contrasena
    nombre: "Cambio de contraseña (y elección obligatoria en el primer ingreso)"
    audiencia: usuario
    ruta: "#/password"
    precondiciones: ["usuario tester logueado"]
    pasos:
      - "Ajustes → «Cambiar contraseña» (o forzado en el primer ingreso)"
      - "completar contraseña actual, nueva y repetirla (mínimo 8)"
      - "tocar Guardar"
    selectores:
      actual: "#current"
      nueva: "#next"
      repetir: "#repeat"
      guardar: "role=button[name='Guardar']"
      abrir_desde_ajustes: "role=button[name='Cambiar contraseña']"
    faltan_testids: ["password-guardar"]
    datos_prueba: {nota: "no grabar con la cuenta tester real: cierra sesiones en otros dispositivos"}
    complejidad: baja
    requiere: [red]
    fuentes: ["web/js/account.js (viewPassword)", "app/auth_api.py (/api/password)"]

  - id: cerrar-sesion
    nombre: "Cerrar sesión"
    audiencia: usuario
    ruta: "#/ajustes"
    precondiciones: ["usuario tester logueado"]
    pasos: ["ir a Ajustes", "tocar «Cerrar sesión»", "vuelve a #/login (borra push, copias sin señal y gastos locales)"]
    selectores:
      ajustes: "[aria-label='Ajustes']"
      cerrar_sesion: "role=button[name='Cerrar sesión']"
    faltan_testids: ["ajustes-cerrar-sesion"]
    datos_prueba: {}
    complejidad: baja
    requiere: [red]
    fuentes: ["web/js/app.js (viewSettings.logout)", "app/auth_api.py (/api/logout)"]

  - id: cambio-de-tema
    nombre: "Tema claro / oscuro"
    audiencia: usuario
    ruta: "cualquier pantalla (barra superior)"
    precondiciones: []
    pasos: ["tocar el botón de luna/sol arriba a la derecha", "la app cambia de tema y lo recuerda"]
    selectores:
      tema: "#themeBtn"
    faltan_testids: []
    datos_prueba: {}
    complejidad: baja
    requiere: []
    fuentes: ["web/index.html (#themeBtn)", "web/js/app.js (applyTheme)"]

  - id: ajustes-ubicacion-y-alertas
    nombre: "Ajustes: usar mi ubicación y márgenes de alertas"
    audiencia: usuario
    ruta: "#/ajustes"
    precondiciones: ["usuario tester logueado"]
    pasos:
      - "ir a Ajustes"
      - "prender «Usar mi ubicación» (distancias y minutos caminando)"
      - "cambiar «Margen para salir (min)» y «Aviso de inicio (min antes)»"
    selectores:
      usar_ubicacion: "#use-location"
      margen_salir: "#leave-margin"
      aviso_inicio: "#start-notice"
    faltan_testids: []
    datos_prueba: {margen_salir: 10, aviso_inicio: 5}
    complejidad: baja
    requiere: [geolocalizacion]
    fuentes: ["web/js/app.js (LocationSetting, AlertSettings)", "web/js/location.js"]

  - id: notificaciones-push
    nombre: "Notificaciones en el celular (activar, probar y elegir avisos)"
    audiencia: usuario
    ruta: "#/ajustes"
    precondiciones: ["usuario tester logueado", "navegador con Web Push (en iPhone, app instalada en inicio)"]
    pasos:
      - "ir a Ajustes → «Notificaciones en el celular»"
      - "prender «Activar notificaciones» y aceptar el permiso"
      - "tocar «Probar una notificación»"
      - "prender/apagar «Recordarme grabar», «Avisarme de eventos nuevos», «Usar en qué sede estoy para los avisos»"
      - "prender los avisos de vuelos/hoteles y de ofertas (con categorías)"
    selectores:
      activar: "#push-on"
      probar: "role=button[name='Probar una notificación']"
      recordarme_grabar: "#push-grabar"
      eventos_nuevos: "#push-eventos-nuevos"
      usar_sede: "#push-sede"
      ofertas_on: "#ofertas-on"
      ofertas_categoria: "#ofertas-cat-shows, #ofertas-cat-comida, #ofertas-cat-compras, #ofertas-cat-otros"
    faltan_testids: ["push-probar"]
    datos_prueba: {}
    complejidad: media
    requiere: [push, red]
    fuentes: ["web/js/notifications.js (PushSettings, ReminderSettings, ViajesSettings)", "web/js/ofertas.js (OfertasSettings)", "app/push_api.py", "app/ubicacion_api.py", "app/ofertas_api.py (/api/ofertas/preferencias)", "app/viajes_api.py (/api/viajes/preferencias)"]

  - id: passkey-ajustes
    nombre: "Activar / quitar Face ID o huella para entrar"
    audiencia: usuario
    ruta: "#/ajustes (y oferta en Inicio)"
    precondiciones: ["usuario tester logueado", "dispositivo con WebAuthn"]
    pasos:
      - "en Inicio, tarjeta de oferta → «Activar» (o «Ahora no»)"
      - "o en Ajustes → «Activar en este dispositivo»"
      - "confirmar con biometría"
      - "para quitar: «Quitar» en la fila de la passkey"
    selectores:
      activar_inicio: "role=button[name='Activar']"
      ahora_no: "role=button[name='Ahora no']"
      activar_ajustes: "role=button[name='Activar en este dispositivo']"
      quitar: "role=button[name='Quitar']"
    faltan_testids: ["passkey-activar", "passkey-quitar"]
    datos_prueba: {}
    complejidad: media
    requiere: [biometria, red]
    fuentes: ["web/js/passkey.js (PasskeyOffer, PasskeySettings)", "app/passkey_api.py"]

  - id: instalar-pwa
    nombre: "Instalar la app en el celular"
    audiencia: usuario
    ruta: "#/ (tarjeta en Inicio) y #/ajustes"
    precondiciones: ["usuario tester logueado", "app abierta en el navegador (no instalada)"]
    pasos: ["ver «Instalá ReinventAR en el celular»", "Android: tocar «Instalar app»; iPhone: seguir los pasos de Compartir → Agregar a inicio"]
    selectores:
      instalar: "role=button[name='Instalar app']"
      titulo: "text=Instalá ReinventAR en el celular"
    faltan_testids: ["instalar-app"]
    datos_prueba: {}
    complejidad: baja
    requiere: []
    fuentes: ["web/js/install.js (InstallPrompt)"]

  # --- Inicio -----------------------------------------------------------------------------------

  - id: inicio-hoy
    nombre: "Inicio: panel Hoy (ahora, después y el resto del día)"
    audiencia: usuario
    ruta: "#/"
    precondiciones: ["usuario tester logueado", "itinerario con charlas el día actual (o reloj simulado por modo prueba)"]
    pasos:
      - "abrir Inicio"
      - "ver la tarjeta «Ahora» (con cuenta regresiva) y «Después/Próxima»"
      - "ver avisos de cola sin reserva, «salí a las…» y llena/cola"
      - "tocar «Grabar esta charla», «Ver evento/show» o Llevame"
    selectores:
      nav_inicio: "a.navitem[href='#/']"
      seccion_hoy: "#hoy-title"
      fecha_hoy: "#hoy-fecha"
      grabar_esta_charla: "role=button[name='Grabar esta charla']"
      ver_itinerario: "role=button[name='Ver itinerario']"
    faltan_testids: ["hoy-ahora", "hoy-proxima", "hoy-grabar"]
    datos_prueba: {itinerario: "2–3 charlas del día simulado", reloj: "modo prueba con hora de Las Vegas dentro de una charla"}
    complejidad: media
    requiere: [red, datos_previos, reloj_simulado, catalogo]
    fuentes: ["web/js/today.js (TodayPanel, TalkCard, TalkAction)", "web/js/app.js (viewList)", "app/today.py", "app/itinerary_api.py (/api/today)"]

  - id: anuncios-sin-reserva
    nombre: "Inicio: anuncios sin reserva (keynotes y lanzamientos)"
    audiencia: usuario
    ruta: "#/"
    precondiciones: ["usuario tester logueado", "catálogo con keynotes/lanzamientos ese día"]
    pasos:
      - "en Inicio, deslizar la fila «Anuncios sin reserva»"
      - "usar las flechas Anterior/Siguiente"
      - "tocar la tarjeta «+N · Ver todos» → Buscar con el filtro Anuncios"
    selectores:
      seccion: "#anuncios-title"
      fila: "#anuncios-fila"
      anterior: "[aria-controls='anuncios-fila'][aria-label='Anterior']"
      siguiente: "[aria-controls='anuncios-fila'][aria-label='Siguiente']"
      ver_todos: "a.ra-ann.is-more"
    faltan_testids: ["anuncio-card"]
    datos_prueba: {}
    complejidad: baja
    requiere: [red, catalogo, reloj_simulado]
    fuentes: ["web/js/anuncios.js (AnunciosRail)", "app/anuncios.py", "app/itinerary_api.py (/api/anuncios)"]

  - id: lista-de-grabaciones
    nombre: "Inicio: tus grabaciones"
    audiencia: usuario
    ruta: "#/"
    precondiciones: ["usuario tester logueado"]
    pasos: ["abrir Inicio", "ver la lista «Tus grabaciones» con su estado", "tocar una para abrir el detalle (o seguir grabando si está viva)"]
    selectores:
      titulo: "#grabaciones-title"
      nueva: "[aria-label='Nueva grabación']"
      tarjeta: "button.ra-reccard"
    faltan_testids: ["grabacion-card"]
    datos_prueba: {grabaciones: "al menos una en estado ready"}
    complejidad: baja
    requiere: [red, datos_previos]
    fuentes: ["web/js/app.js (viewList)", "web/js/ui.js (SessionCard)", "app/main.py (/api/sessions)"]

  - id: buscar-en-lo-grabado
    nombre: "Buscar en lo que grabaste"
    audiencia: usuario
    ruta: "#/"
    precondiciones: ["usuario tester logueado", "al menos una grabación procesada (ready)"]
    pasos:
      - "en Inicio, escribir en «Buscar en lo que grabaste»"
      - "ver los momentos encontrados"
      - "tocar uno: abre la transcripción en ese segundo con la marca «Desde la búsqueda»"
    selectores:
      campo: "[aria-label='Buscar en lo que grabaste']"
      resultado: "a.ra-hit"
      quitar_marca: "[aria-label='Quitar la marca de la búsqueda']"
    faltan_testids: ["grabado-resultado"]
    datos_prueba: {consulta: "agentes"}
    complejidad: media
    requiere: [red, datos_previos]
    fuentes: ["web/js/grabado.js (RecordingSearch, MomentCard)", "web/js/detail.js", "app/fragmentos.py", "app/main.py (/api/grabaciones/buscar)"]

  # --- Grabación ---------------------------------------------------------------------------------

  - id: nueva-grabacion
    nombre: "Nueva grabación (manual o eligiendo la charla del catálogo)"
    audiencia: usuario
    ruta: "#/nueva"
    precondiciones: ["usuario tester logueado"]
    pasos:
      - "Inicio → «Nueva»"
      - "opcional: buscar la charla en el selector y elegirla (completa título, código, sala y speakers)"
      - "elegir Tipo (Keynote / Chalk talk / Workshop / Breakout)"
      - "completar Título (y opcionalmente Código, Sala, Speakers)"
      - "tocar «Preparar grabación» → abre el grabador"
    selectores:
      nueva: "[aria-label='Nueva grabación']"
      buscar_charla: "#talkq"
      tipo_keynote: "#k0"
      titulo: "#title"
      codigo: "#code"
      sala: "#venue"
      speakers: "#speaker"
      preparar: "role=button[name='Preparar grabación']"
    faltan_testids: ["nueva-preparar", "talkpicker-resultado"]
    datos_prueba: {titulo: "Keynote de apertura", codigo: "ANT301", sala: "Venetian · Hall A"}
    complejidad: baja
    requiere: [red]
    fuentes: ["web/js/app.js (viewNew, fillFromTalk)", "web/js/talkpicker.js", "web/js/recorder.js (empezarSesion)", "app/main.py (POST /api/sessions)", "app/knowledge_api.py (/api/k/talks/pick)"]

  - id: grabar-charla
    nombre: "Grabar una charla (grabar, pausar, modo sala, terminar y procesar)"
    audiencia: usuario
    ruta: "#/grabar/{id}"
    precondiciones: ["usuario tester logueado", "sesión de grabación creada (nueva-grabacion o «Grabar esta charla»)", "permiso de micrófono"]
    pasos:
      - "esperar «Abriendo el micrófono…» y elegir el micrófono"
      - "tocar el botón grande para empezar (medidor de nivel y contador)"
      - "pausar y seguir"
      - "opcional: «Modo sala» (pantalla negra con contador; tocar para salir)"
      - "tocar «Terminar y procesar» → espera la subida y abre el detalle"
      - "alternativa: «Descartar» (pide confirmación)"
    selectores:
      microfono: "#mic"
      entrada_audio: "[aria-label='Entrada de audio']"
      grabar: "button.ra-rec[aria-label='Empezar a grabar']"
      pausar: "button.ra-rec[aria-label='Pausar grabación']"
      seguir: "button.ra-rec[aria-label='Seguir grabando']"
      modo_sala: "role=button[name='Modo sala']"
      salir_sala: "[aria-label='Modo sala. Tocá para salir.']"
      terminar: "role=button[name='Terminar y procesar']"
      descartar: "role=button[name='Descartar']"
      contador: ".recorder .counter"
    faltan_testids: ["grabador-terminar", "grabador-descartar", "grabador-estado"]
    datos_prueba: {audio: "parlante cerca con un audio en inglés de 1–2 min", modo: "STT y LLM en fake (modo prueba) para no gastar"}
    complejidad: alta
    requiere: [microfono, red, stt, llm]
    fuentes: ["web/js/app.js (viewRecord)", "web/js/recorder.js", "web/js/huecos.js", "web/js/store.js", "app/main.py (/api/sessions/{id}/chunks, /finish, /huecos)", "app/audio.py", "app/stt.py", "app/pipeline.py"]

  - id: grabar-desde-charla
    nombre: "«Grabar esta charla» desde Hoy, la ficha o el aviso «¿La grabás?»"
    audiencia: usuario
    ruta: "#/grabar-charla/{code} (también botones en #/ y #/charla/{base})"
    precondiciones: ["usuario tester logueado", "la charla está en el itinerario (para #/grabar-charla)"]
    pasos:
      - "tocar «Grabar esta charla» en Hoy o en la ficha, o abrir el push «¿La grabás?»"
      - "en #/grabar-charla tocar «Empezar a grabar»"
      - "se crea la sesión con los datos de la charla y abre el grabador"
    selectores:
      empezar: "role=button[name='Empezar a grabar']"
      grabar_esta: "role=button[name='Grabar esta charla']"
      grabar_otra: "role=button[name='Grabar otra cosa']"
    faltan_testids: ["grabar-charla-empezar"]
    datos_prueba: {codigo: "código de una charla del itinerario del tester"}
    complejidad: media
    requiere: [microfono, red, datos_previos]
    fuentes: ["web/js/grabarCharla.js", "web/js/today.js (recordTalk)", "web/js/knowledge.js (TalkRecordAction)", "app/recordatorio.py"]

  - id: grabar-sin-senal
    nombre: "Grabar sin señal (se guarda en el celular y se sube cuando vuelve la red)"
    audiencia: usuario
    ruta: "#/grabar/loc_… y #/ (bloque de grabaciones pendientes)"
    precondiciones: ["usuario tester logueado", "red cortada (modo avión o DevTools offline)"]
    pasos:
      - "sin red, empezar una grabación: aviso «Sin señal: se graba en el celular…»"
      - "terminar: queda «Terminando: se sube y se procesa en cuanto haya señal…»"
      - "en Inicio aparece en el bloque de grabaciones locales pendientes"
      - "volver a tener red: se sube sola y aparece en la lista"
    selectores:
      pendientes: "#locales-title"
      subiendo: ".notice.upl"
      reintentar: "role=button[name='Reintentar']"
    faltan_testids: ["locales-pendientes", "subida-estado"]
    datos_prueba: {}
    complejidad: alta
    requiere: [microfono, red]
    fuentes: ["web/js/recorder.js (uploader)", "web/js/store.js", "web/js/locales.js", "web/js/app.js (finishLocal, diferirCierre)"]

  - id: detalle-de-grabacion
    nombre: "Detalle de una grabación: resumen, transcripción, voto, exportar y eliminar"
    audiencia: usuario
    ruta: "#/s/{id} (y #/s/{id}/t/{segundo}?q=…)"
    precondiciones: ["usuario tester logueado", "grabación procesada (ready)"]
    pasos:
      - "abrir una grabación desde Inicio"
      - "pestaña Resumen: leer el resumen y votar «¿Te sirvió este resumen?» 👍/👎"
      - "pestaña Transcripción: bloques en castellano con el original, y tramos sin audio"
      - "«Ver la ficha de la charla» si está vinculada"
      - "barra superior: Compartir (.md) y menú «Más acciones» → Exportar .md / Eliminar"
      - "si quedó en error: «Reintentar»; si sigue viva: «Seguir grabando»"
    selectores:
      volver: "#pagebar [aria-label='Volver']"
      compartir: "[aria-label='Compartir el resumen (.md)']"
      mas_acciones: "[aria-label='Más acciones']"
      exportar: "role=menuitem[name='Exportar .md']"
      eliminar: "role=menuitem[name='Eliminar']"
      tab_resumen: "role=tab[name='Resumen']"
      tab_transcripcion: "role=tab[name='Transcripción']"
      voto_si: "role=button[name='Me sirvió']"
      voto_no: "role=button[name='No me sirvió']"
      ver_ficha: "a.ra-talklink"
      reintentar: "role=button[name='Reintentar']"
    faltan_testids: ["detalle-voto-si", "detalle-voto-no", "detalle-transcripcion-bloque"]
    datos_prueba: {grabacion: "una grabación ready del tester, vinculada a una charla"}
    complejidad: media
    requiere: [red, datos_previos]
    fuentes: ["web/js/detail.js (viewDetail, VotoResumen)", "web/js/menu.js", "app/main.py (/api/sessions/{id}, /export.md, /retry, DELETE)", "app/voto_resumen_api.py"]

  # --- Buscar ------------------------------------------------------------------------------------

  - id: buscar-filtrar
    nombre: "Buscar charlas con filtros (y «Convertir en filtros» en lenguaje natural)"
    audiencia: usuario
    ruta: "#/buscar"
    precondiciones: ["usuario tester logueado", "catálogo de re:Invent cargado"]
    pasos:
      - "tocar Buscar en la barra"
      - "escribir en el campo (ej. «bancos el martes»)"
      - "tocar la sugerencia «Convertir «…» en filtros»"
      - "abrir Filtros, marcar facetas (Día, Sector, Tipo, Nivel, Servicio de AWS…) y «Ver N charlas»"
      - "opcional: «Agrupar por» una faceta"
      - "en un resultado tocar «Agregar» (queda «Agregada») o abrir la ficha"
      - "«Mostrar más» para paginar"
    selectores:
      nav_buscar: "a.navitem[href='#/buscar']"
      modo_filtrar: "#tab-filtrar"
      campo: "[aria-label='Buscar charlas']"
      convertir: "button.ra-suggest"
      filtros: "button.ra-infield-btn"
      hoja_filtros: "dialog.ra-sheet[aria-labelledby='sheet-title']"
      cerrar_filtros: "[aria-label='Cerrar filtros']"
      agrupar: "[aria-label='Agrupar por']"
      agregar: "[aria-label='Agregar al itinerario']"
      mostrar_mas: "role=button[name='Mostrar más']"
    faltan_testids: ["buscar-resultado", "buscar-contador", "filtros-ver-charlas", "filtros-limpiar"]
    datos_prueba: {consulta: "bancos el martes", alternativa: "agentes con Bedrock"}
