feature: itinerario-armar-dia
titulo: "Armá tu día, charla por charla"
beneficio: "Elegís con qué arrancás y la app te propone lo que sigue."
ruta: "#/itinerario/armar"
notas: >-
  Requiere ficha creada (si no, redirige a la entrevista) y un día con lugar libre: si el día ya está lleno no hay
  opciones ni «Completá el resto del día por mí ✨». «Elegir» y «Completá…» agregan charlas al itinerario del tester.
  Las opciones, los motivos y los estados del semáforo dependen del catálogo y del LLM: no se narra ninguna charla en
  particular. Las personas y eventos del cierre aparecen solo si hay speakers en las charlas del día y eventos desde
  las 17 h. .tabs [role=tab] y role=button[name='Elegir'] matchean varios (dayBuilder.js:56,130): tomar el primero.
  La primera pestaña es el domingo 29/11, que no tiene opciones: se usa la sexta (vie 4/12, una sola charla en el
  itinerario armado para tester en staging). Las opciones las arma el LLM y tardan unos 15 s en aparecer: el
  runner tiene que esperar role=button[name='Elegir'] antes de la escena 4, no solo el wait de la escena 3.
escenas:
  - id: 1
    accion: "goto #/itinerario/armar"
    narracion: "Con tu ficha lista, armás cada día charla por charla, sin correr entre sedes."
    subtitulo: "Armás cada día charla por charla,\nsin correr entre sedes."
    duracion_s: 7
  - id: 2
    accion: "click .tabs [role=tab]:nth-child(6)"
    narracion: "Elegís el día y la app te pregunta con qué arrancás."
    subtitulo: "Elegís el día:\n¿con qué arrancás?"
    duracion_s: 6
  - id: 3
    accion: "wait 3"
    narracion: "Cada opción te dice por qué te sirve y desde qué hora hacer la cola."
    subtitulo: "Cada opción: por qué te sirve\ny desde qué hora hacer la cola."
    duracion_s: 7
  - id: 4
    accion: "click role=button[name='Elegir']"
    narracion: "Elegís una y te propone lo que sigue, contando el traslado."
    subtitulo: "Elegís una y te propone\nlo que sigue."
    duracion_s: 6
  - id: 5
    accion: "wait 3"
    narracion: "El semáforo te avisa si llegás a tiempo, justo, si tenés que salir antes o si se superpone."
    subtitulo: "A tiempo, justo, salí antes\no se superpone: el semáforo avisa."
    duracion_s: 9
  - id: 6
    accion: "click role=button[name='Completá el resto del día por mí ✨']"
    narracion: "¿Sin tiempo? Le pedís que complete el resto del día por vos."
    subtitulo: "¿Sin tiempo? Que complete\nel resto del día por vos."
    duracion_s: 6
  - id: 7
    accion: "wait 10"
    narracion: "Va eligiendo charlas a las que llegás, hasta el ritmo que pediste."
    subtitulo: "Elige charlas a las que llegás,\nhasta el ritmo que pediste."
    duracion_s: 11
  - id: 8
    accion: "click role=button[name='Terminar el día']"
    narracion: "Al terminar el día, ves cuántas charlas te quedaron."
    subtitulo: "Terminás el día y ves\ncómo te quedó."
    duracion_s: 5
  - id: 9
    accion: "wait 3"
    narracion: "Y el cierre te sugiere personas para conocer y eventos para la noche."
    subtitulo: "Personas para conocer\ny eventos para la noche."
    duracion_s: 7
