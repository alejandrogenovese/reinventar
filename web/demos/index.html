<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1a1a">
  <title>Cómo se usa ReinventAR · videos demo</title>
  <meta name="description" content="Videos cortos que muestran cada funcionalidad de ReinventAR, la app para recorrer re:Invent.">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/demos/demos.css">
  <script type="module" src="/demos/demos.js"></script>
</head>
<body>
  <header class="dm-hero">
    <div class="dm-ancho">
      <a class="dm-marca" href="/">
        <img src="/icons/icon.svg" alt="" width="40" height="40">
        <span>reinventar</span>
      </a>
      <div class="dm-acento" aria-hidden="true"></div>
      <h1>Cómo se usa ReinventAR</h1>
      <p class="dm-bajada">Videos cortos, de menos de un minuto, con cada cosa que hace la app: tu agenda, grabar
        charlas, moverte entre sedes y organizar el viaje.</p>
    </div>
  </header>

  <main class="dm-ancho">
    <div class="dm-filtros" role="search">
      <label class="dm-buscar">
        <span class="dm-oculto">Buscar un video</span>
        <input id="buscar" type="search" placeholder="Buscar: grabar, itinerario, gastos…" autocomplete="off">
      </label>
      <p id="conteo" class="dm-conteo" aria-live="polite"></p>
    </div>

    <p id="estado" class="dm-estado">Cargando los videos…</p>
    <ul id="grilla" class="dm-grilla" aria-label="Videos demo"></ul>
  </main>

  <dialog id="reproductor" class="dm-reproductor" aria-labelledby="rep-titulo">
    <div class="dm-rep-cabecera">
      <h2 id="rep-titulo"></h2>
      <button id="cerrar" class="dm-cerrar" type="button" aria-label="Cerrar el video">✕</button>
    </div>
    <video id="video" controls playsinline preload="metadata"></video>
    <p id="rep-beneficio" class="dm-rep-beneficio"></p>
  </dialog>

  <footer class="dm-pie dm-ancho">
    <a href="/">Abrir ReinventAR</a>
  </footer>
</body>
</html>
