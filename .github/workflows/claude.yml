name: Claude Code

# Responde cuando alguien con permiso de escritura menciona @claude en un issue, un PR o una revisión.
# Requiere: secret CLAUDE_CODE_OAUTH_TOKEN (generado con `claude setup-token`) y la GitHub App de Claude instalada.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Sin permisos por defecto: el job pide solo los que necesita.
permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reinvent
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reinvent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U reinvent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reinvent@localhost:5433/reinvent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Python y dependencias listos para que Claude pueda correr pytest (sin catálogo, igual que CI).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Dependencias
        # Lock con hashes de todas las dependencias (también las transitivas) y solo wheels:
        # pip no ejecuta scripts de instalación de paquetes fuente.
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.lock

      - name: Claude Code
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Las ramas que crea Claude salen de dev y sus PRs van contra dev, nunca contra main.
          base_branch: dev
          claude_args: >-
            --max-turns 30
            --allowedTools "Bash(pytest:*),Bash(python -m pytest:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
          additional_permissions: |
            actions: read
