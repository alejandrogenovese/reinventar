name: Claude Code

# Responde cuando alguien con permiso de escritura menciona @claude en un issue, un PR o una revisión.
# Requiere: secret CLAUDE_CODE_OAUTH_TOKEN (generado con `claude setup-token`) y la GitHub App de Claude instalada.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reinvent
          POSTGRES_PASSWORD: reinvent2026
          POSTGRES_DB: reinvent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U reinvent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reinvent:reinvent2026@localhost:5433/reinvent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Python y dependencias listos para que Claude pueda correr pytest (sin catálogo, igual que CI).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 30
            --allowedTools "Bash(pytest:*),Bash(python -m pytest:*),Bash(pip install:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
          additional_permissions: |
            actions: read
