name: CI y promoción dev → main

# Flujo: se trabaja en dev (o en ramas feat/fix con PR a dev).
# Cada push a dev corre los tests de núcleo; si pasan, main se adelanta a dev (fast-forward)
# y Railway, conectado al repo, deploya solo con ese push a main.
# En PRs a dev o a main solo corren los tests.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests de núcleo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reinvent
          POSTGRES_DB: reinvent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U reinvent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reinvent@localhost:5433/reinvent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # ffmpeg: lo usa el pipeline de audio y el test de flujo completo (igual que el Dockerfile).
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Dependencias
        # Lock con hashes de todas las dependencias (también las transitivas) y solo wheels:
        # pip no ejecuta scripts de instalación de paquetes fuente.
        run: pip install --require-hashes --only-binary :all: -r requirements-dev.lock

      # Los tests que usan el catálogo de re:Invent (charlas reales como ARC407) necesitan
      # el schema reinvent cargado y no corren en CI: se corren local con pytest -q.
      - name: pytest (sin catálogo)
        run: >-
          pytest -q
          --ignore=tests/test_briefing.py
          --ignore=tests/test_catalog_pg.py
          --ignore=tests/test_clusters.py
          --ignore=tests/test_explore.py
          --ignore=tests/test_itinerary.py
          --ignore=tests/test_knowledge.py
          --ignore=tests/test_nl_filters.py
          --ignore=tests/test_search.py
          --ignore=tests/test_talk_link.py
          --ignore=tests/test_today.py
          --deselect=tests/test_auth.py::test_itinerarios_quedan_separados_por_usuario

  promote:
    name: Promover dev → main
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          fetch-depth: 0

      # Solo fast-forward: si main tiene commits que dev no tiene, falla y no pisa nada.
      # Arreglo: git checkout dev && git merge origin/main && git push.
      - name: Fast-forward de main a dev
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main tiene commits que no están en dev. Traelos a dev (git merge origin/main) y volvé a pushear."
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then
            echo "main ya está en el mismo commit que dev; nada para promover."
            exit 0
          fi
          git push origin HEAD:main
          echo "main → $(git rev-parse --short HEAD). Railway deploya solo con este push."
